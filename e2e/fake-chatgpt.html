<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fake ChatGPT</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }

      #sent-messages {
        min-height: 2rem;
      }
    </style>
  </head>
  <body data-testid="fake-chatgpt-page">
    <main>
      <h1>Fake ChatGPT</h1>
      <p>Generation state: <strong data-testid="generation-state">available</strong></p>
      <button type="button" data-testid="fake-start-generating">
        Start generating
      </button>
      <button type="button" data-testid="fake-start-pending">
        Start pending request
      </button>
      <button type="button" data-testid="fake-finish-generating" disabled>
        Finish generating
      </button>
      <button type="button" data-testid="fake-request-approval" disabled>
        Request tool approval
      </button>

      <ol id="sent-messages" aria-label="Sent messages"></ol>

      <form id="composer-container" data-testid="composer">
        <div
          id="prompt-textarea"
          data-testid="prompt-textarea"
          contenteditable="true"
        ></div>
        <button
          id="send-button"
          data-testid="send-button"
          type="button"
          hidden
        >
          Send
        </button>
        <button
          id="stop-button"
          data-testid="stop-button"
          type="button"
          hidden
        >
          Stop
        </button>
      </form>

      <div
        id="tool-approval"
        data-testid="tool-approval"
        role="dialog"
        aria-label="Tool approval"
        hidden
      >
        <p>This tool requires your approval before the response can continue.</p>
        <button type="button" data-testid="fake-approve">Approve tool</button>
      </div>
    </main>

    <script>
      const composer = document.querySelector("#prompt-textarea");
      const sendButton = document.querySelector("#send-button");
      const stopButton = document.querySelector("#stop-button");
      const stateLabel = document.querySelector("[data-testid=\"generation-state\"]");
      const startButton = document.querySelector("[data-testid=\"fake-start-generating\"]");
      const startPendingButton = document.querySelector(
        "[data-testid=\"fake-start-pending\"]",
      );
      const finishButton = document.querySelector("[data-testid=\"fake-finish-generating\"]");
      const requestApprovalButton = document.querySelector(
        "[data-testid=\"fake-request-approval\"]",
      );
      const approvalPanel = document.querySelector("#tool-approval");
      const approveButton = document.querySelector("[data-testid=\"fake-approve\"]");
      const sentMessages = document.querySelector("#sent-messages");

      let state = "available";
      let finishTimer;

      function hasComposerContent() {
        return composer.innerText.trim().length > 0;
      }

      function updateComposerControls() {
        const hasContent = hasComposerContent();
        sendButton.hidden = !hasContent;
        // Pending requests and approvals can still expose an enabled send
        // control before streaming begins.
        const canSendWhile =
          state === "available" || state === "awaiting" || state === "pending";
        sendButton.disabled = !canSendWhile || !hasContent;
      }

      function setState(nextState, autoFinish = false) {
        state = nextState;
        const generating = state === "generating";
        const awaiting = state === "awaiting";

        stateLabel.textContent = state;
        stopButton.hidden = !generating;
        approvalPanel.hidden = !awaiting;
        startButton.disabled = generating || awaiting;
        finishButton.disabled = !generating;
        requestApprovalButton.disabled = !generating;
        document.body.dataset.generationState = state;
        updateComposerControls();

        if (finishTimer) {
          clearTimeout(finishTimer);
          finishTimer = undefined;
        }

        if (autoFinish) {
          finishTimer = setTimeout(() => setState("available"), 80);
        }
      }

      function finishGeneration() {
        setState("available");
      }

      function approveTool() {
        // The response resumes streaming, then completes on its own.
        setState("generating", true);
      }

      function sendMessage() {
        // ChatGPT natively accepts sends both when idle and during a pending
        // approval (the "Follow up" behavior). It refuses them while a
        // response is streaming.
        if (state !== "available" && state !== "awaiting") {
          return;
        }

        const content = composer.innerText.trim();

        if (!content) {
          return;
        }

        if (sendButton.dataset.ignoreClicks === "true") {
          return;
        }

        const message = document.createElement("li");
        message.textContent = content;
        sentMessages.append(message);
        composer.textContent = "";
        composer.dispatchEvent(new Event("input", { bubbles: true }));

        if (sendButton.dataset.slowRequest === "true") {
          delete sendButton.dataset.slowRequest;
          setState("pending");
          return;
        }

        setState("generating", true);
      }

      sendButton.addEventListener("click", sendMessage);
      stopButton.addEventListener("click", finishGeneration);
      startButton.addEventListener("click", () => setState("generating"));
      startPendingButton.addEventListener("click", () => setState("pending"));
      finishButton.addEventListener("click", finishGeneration);
      requestApprovalButton.addEventListener("click", () => setState("awaiting"));
      approveButton.addEventListener("click", approveTool);
      composer.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          sendMessage();
        }
      });
      composer.addEventListener("input", updateComposerControls);

      setState("available");
    </script>
  </body>
</html>
